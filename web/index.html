<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>만화 제작기</title>
  <link rel="stylesheet" href="../../_app/base.css">
  <link rel="stylesheet" href="style.css">
  <script src="../../_app/peropix.js"></script>
  <script src="i18n.js"></script>
  <script type="module" src="app.js?v=1.4.0"></script>
</head>
<!-- ★골격은 공통 CSS 의 `body:has(> main)` 에 맡긴다 (머리줄은 두께 그대로, 본문만 늘어난다).
     예전에는 `calc(100vh - 78px)` 로 머리 높이를 숫자로 박아 두어, 창이 좁아 머리가 두 줄로
     접히면 왼쪽 패널 높이가 어긋났다. -->
<body>
  <!-- ★제목을 여기서 다시 쓰지 않는다 — 창틀이 이미 「만화 제작기」를 달고 있다 -->
  <header>
    <select id="projects" aria-label="저장된 만화"><option value="" data-t>새 만화</option></select>
    <button id="new" data-t>새 만화</button>
    <span class="spacer"></span>
    <button id="export" disabled data-t>ZIP 저장</button>
  </header>
  <div id="alert" role="alert" hidden></div>
  <main class="shell">
    <aside class="setup">
      <div id="setupBody">

      <div class="compose">
        <div class="compose-head"><strong data-t>이번에 그릴 내용</strong><button id="example" class="ghost" data-t>예시 넣기</button></div>
        <!-- ★안내 문구는 `controls()` 가 상태에 따라 넣는다 (새 만화 ↔ 이어서 그리기) -->
        <textarea id="story" rows="3" aria-label="이번에 그릴 내용"></textarea>
        <label class="compose-count"><span data-t>장수</span><select id="pageCount"><option value="0" data-t>자동</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label>
        <div class="compose-actions">
          <button id="plan" data-t>콘티만</button>
          <button id="automatic" class="primary" data-t>콘티 + 이미지</button>
        </div>
        <p id="composeHint" class="hint" hidden></p>
      </div>

      <div class="llm-fixed">
        <div class="llm-head"><span data-t>기획 LLM</span><button id="llmRefresh" class="ghost" data-t>새로고침</button></div>
        <select id="llmProvider" aria-label="기획 LLM 공급자"><option value="" data-t>앱 API 설정 따르기</option></select>
        <div class="llm-row">
          <select id="llmModel" aria-label="기획 LLM 모델"><option value="" data-t>모델을 고르세요</option></select>
          <select id="llmEffort" aria-label="추론 강도" hidden></select>
        </div>
        <p id="llm" class="hint"></p>
      </div>

      <div class="tabs" role="tablist" aria-label="설정">
        <button class="tabitem" data-tab="story" role="tab" aria-selected="true" data-t>구성</button>
        <button class="tabitem" data-tab="style" role="tab" aria-selected="false" data-t>화풍</button>
        <button class="tabitem" data-tab="generation" role="tab" aria-selected="false" data-t>생성</button>
        <button class="tabitem" data-tab="destination" role="tab" aria-selected="false" data-t>저장</button>
      </div>

      <div class="tabpane" data-pane="story"><div class="fields two">
        <label><span data-t>페이지당 최대 컷</span><select id="maxPanels"><option value="0" data-t>자동</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></label>
        <label><span data-t>컷 구성</span><select id="layoutMode"><option value="free" data-t>자유 배치</option><option value="template" data-t>고정 템플릿</option></select></label>
        <label><span data-t>읽는 방향</span><select id="direction"><option value="rtl" data-t>오른쪽부터</option><option value="ltr" data-t>왼쪽부터</option></select></label>
        <label><span data-t>대사 언어</span><select id="dialogue"><option value="ko" data-t>한국어</option><option value="ja" data-t>일본어</option><option value="en" data-t>영어</option><option value="none" data-t>대사 없음</option></select></label>
      </div>
      <button id="translateDialogue" class="wide" disabled data-t data-t-title="이미 적힌 대사를 고른 언어로 옮깁니다">대사 번역</button>
      </div>

      <div class="tabpane" data-pane="style" hidden><div class="fields">
        <label><span data-t>화풍 선택</span><select id="style"><option value="mono" data-t>흑백 만화</option><option value="color" data-t>컬러 만화</option><option value="custom" data-t>내 화풍</option></select></label>
        <div class="style-library" aria-label="저장된 화풍">
          <div class="style-library-heading"><strong data-t>내 화풍</strong><button id="refreshStyles" class="ghost" data-t>새로고침</button></div>
          <div class="style-picker">
            <button id="stylePicker" class="style-picker-button" aria-haspopup="listbox" aria-expanded="false" disabled><span id="stylePickerLabel" data-t>저장된 화풍 없음</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
            <div id="styleList" class="style-list" role="listbox" aria-label="저장된 화풍" hidden></div>
          </div>
        </div>
        <div id="styleRefDrop" class="reference-drop"><label><span data-t>참고 이미지 가져오기</span><input id="styleImage" type="file" accept="image/png,image/jpeg,image/webp"></label><div id="referenceActivity" class="inline-activity" role="status" hidden><span class="spinner" aria-hidden="true"></span><span data-t>프롬프트와 생성 옵션 가져오는 중</span></div><img id="styleRefPreview" hidden alt="선택한 화풍 참고 이미지"><p id="styleRefName" class="hint"></p><p id="importedOptions" class="imported-options" role="status" hidden></p></div>
        <div class="style-text">
          <label><span data-t>공통 화풍 프롬프트</span><textarea id="stylePrompt" rows="3" data-t-placeholder="작화 태그, 분위기, 선의 느낌"></textarea></label>
          <label><span data-t>공통 네거티브 프롬프트</span><textarea id="negativePrompt" rows="4"></textarea></label>
        </div>
        <div class="style-save">
          <div id="styleNameRow" class="style-name-row" hidden>
            <input id="styleName" maxlength="120" aria-label="새 화풍 이름">
            <button id="styleNameOk" class="icon-btn" aria-label="저장" data-t-title="저장"></button>
            <button id="styleNameCancel" class="icon-btn" aria-label="취소" data-t-title="취소"></button>
          </div>
          <button id="saveStyle" class="wide" data-t data-t-title="지금 프롬프트와 생성 옵션을 화풍으로 저장합니다">화풍으로 저장</button>
          <p id="styleLibraryStatus" class="style-library-status" role="status" aria-live="polite"></p>
        </div>
      </div></div>

      <div class="tabpane" data-pane="generation" hidden><div class="fields">
        <span id="generationSummary" class="summary-value" hidden></span>
        <label><span data-t>이미지 모델</span><select id="model"><option value="nai-diffusion-5-full">NAI V5 Full</option><option value="nai-diffusion-5-curated">NAI V5 Curated</option></select></label>
        <label><span data-t>페이지 크기</span><select id="size"><option value="832,1216">832 × 1216</option><option value="1024,1536">1024 × 1536</option><option value="1216,1792">1216 × 1792</option><option value="1216,832">1216 × 832</option><option value="1024,1024">1024 × 1024</option><option value="custom" data-t>직접 입력</option></select></label>
        <div class="fields two"><label><span data-t>가로 픽셀</span><input id="width" type="number" min="64" step="64" value="832"></label><label><span data-t>세로 픽셀</span><input id="height" type="number" min="64" step="64" value="1216"></label></div>
        <div class="fields two"><label><span data-t>스텝</span><input id="steps" type="number" min="1" max="50" value="28"></label><label>CFG<input id="cfg" type="number" min="0" max="10" step="0.1" value="5"></label></div>
        <div class="fields two"><label><span data-t>가이던스 리스케일</span><input id="cfgRescale" type="number" min="0" max="1" step="0.01" value="0"></label><label><span data-t>시드</span><input id="seed" type="number" min="-1" max="4294967295" value="-1"></label></div>
        <label><span data-t>샘플러</span><select id="sampler"><option value="k_euler_ancestral">Euler Ancestral</option><option value="k_euler">Euler</option><option value="k_dpmpp_2m">DPM++ 2M</option><option value="k_dpmpp_2m_sde">DPM++ 2M SDE</option><option value="k_dpmpp_2s_ancestral">DPM++ 2S Ancestral</option><option value="k_dpmpp_sde">DPM++ SDE</option></select></label>
      </div></div>

      <div class="tabpane" data-pane="destination" hidden><div class="fields">
        <label><span data-t>저장할 워크스페이스</span><select id="workspace"></select></label>
        <label><span data-t>NAI 계정</span><select id="account"></select></label>
      </div></div>

      </div>
      <!-- ★접기 손잡이는 기둥 가장자리에 (앱의 좌우 패널과 같은 자리·같은 모양) -->
      <button id="toggleSetup" class="edge-handle" aria-expanded="true" aria-controls="setupBody" data-t-title="설정 접기"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 5-5 5 5 5"/></svg></button>
    </aside>
    <section class="work">
      <section id="activityCard" class="progress-card"><span id="activitySpinner" class="spinner large" aria-hidden="true" hidden></span><div><div class="activity-heading"><strong id="projectTitle"></strong><span id="activityBadge" class="activity-badge"></span></div><p id="status" role="status" aria-live="polite"></p><div id="activityDetail" hidden><div class="activity-meta"><span id="activityCount"></span><span id="elapsed"></span></div><progress id="activityProgress" aria-label="현재 작업의 완료 페이지"></progress></div></div><button id="stop" hidden data-t>멈추기</button></section>
      <div id="pageNav" class="page-nav" aria-label="페이지 목록"></div>
      <div id="empty" class="empty"><svg viewBox="0 0 180 210" aria-hidden="true"><rect x="20" y="10" width="140" height="190" rx="3"/><path d="M30 20h120v60H30zM30 90h55v45H30zM95 90h55v45H95zM30 145h120v45H30z"/><circle cx="115" cy="53" r="12"/><path d="M93 79q22-29 44 0M40 120l15-18 20 22M50 175h65"/></svg><p data-t>아직 만든 만화가 없습니다</p></div>
      <section id="content" hidden>
        <div class="toolbar"><div class="row"><button id="boardMode" aria-pressed="true" data-t>콘티</button><button id="imageMode" aria-pressed="false" data-t>생성 이미지</button></div><div class="row"><button id="generatePage" data-t>이 페이지 생성</button><button id="generateAll" class="primary" data-t>남은 페이지 생성</button></div></div>
        <div class="view-controls"><label for="previewWidth" data-t>보기 너비</label><input id="previewWidth" type="range" min="320" max="2000" step="20" value="1200"><output id="previewWidthValue" for="previewWidth"></output><button id="fitPreview" data-t>맞춤</button><span class="spacer"></span><button id="toggleEditor" class="icon-btn" aria-expanded="true" aria-controls="editorPane" data-t-title="편집창 접기"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 5 5 5-5 5"/></svg></button></div>
        <div class="editing"><div class="stage"><div id="board"></div><div id="result" hidden></div></div><div class="editor" id="editorPane"><div id="pageEditor"></div><details id="bible"><summary data-t>공통 캐릭터 설정</summary><div id="characters"></div></details><div id="panelList"></div><details><summary data-t>실제 NAI 프롬프트</summary><div id="prompts"></div></details></div></div>
      </section>
    </section>
  </main>
</body>
</html>
